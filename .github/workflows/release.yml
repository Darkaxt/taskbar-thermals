name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build and verify complete packages
        shell: pwsh
        run: ./scripts/release.ps1 -Phase Build -Tag $env:RELEASE_TAG -OutputDirectory "${env:RUNNER_TEMP}/taskbar-thermals-release"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.ps1 -Phase Publish -Tag $env:RELEASE_TAG -OutputDirectory "${env:RUNNER_TEMP}/taskbar-thermals-release"
